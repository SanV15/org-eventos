<div class="p-8 bg-base-200 min-h-screen">
  <div class="card w-full max-w-3xl mx-auto bg-base-100 shadow-xl">
    <div class="card-body">
<!-- Reemplaza tu actual <h2 class="card-title text-2xl font-bold mb-6">Alta de Cliente</h2> con esto: -->
      <div class="flex items-center gap-3 mb-6">
        <a routerLink="/clientes" class="btn btn-circle btn-ghost btn-sm" title="Regresar al Dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
        </a>
        <h2 class="text-2xl font-bold m-0">Alta de Cliente</h2>
      </div>
      <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
        
        <div class="divider text-primary font-semibold">Datos Personales</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div class="form-control w-full">
            <label class="label"><span class="label-text">Nombre *</span></label>
            <input type="text" formControlName="nombre" class="input input-bordered w-full" />
          </div>
          <div class="form-control w-full">
            <label class="label"><span class="label-text">Apellido Paterno *</span></label>
            <input type="text" formControlName="apellidoPaterno" class="input input-bordered w-full" />
          </div>
          <div class="form-control w-full">
            <label class="label"><span class="label-text">Apellido Materno</span></label>
            <input type="text" formControlName="apellidoMaterno" class="input input-bordered w-full" />
          </div>
        </div>

<div class="divider text-primary font-semibold">Datos de Contacto y Acceso</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div class="form-control w-full">
            <label class="label"><span class="label-text">Correo Electrónico *</span></label>
            <input type="email" formControlName="correo" class="input input-bordered w-full" placeholder="cliente@correo.com" />
          </div>
          <div class="form-control w-full">
            <label class="label"><span class="label-text">Teléfono</span></label>
            <input type="text" formControlName="telefono" class="input input-bordered w-full" />
          </div>
          <div class="form-control w-full md:col-span-2">
            <label class="label"><span class="label-text">Dirección</span></label>
            <input type="text" formControlName="direccion" class="input input-bordered w-full" />
          </div>
        </div>

        <!-- Alertas -->
        <div *ngIf="mensajeExito" class="alert alert-success mt-4">
          <span>{{ mensajeExito }}</span>
        </div>
        <div *ngIf="mensajeError" class="alert alert-error mt-4">
          <span>{{ mensajeError }}</span>
        </div>

        <!-- Botones -->
        <div class="card-actions justify-end mt-6">
          <button type="button" class="btn btn-ghost" (click)="registroForm.reset()">Limpiar</button>
          <button type="submit" class="btn btn-primary" [disabled]="cargando">
            <span *ngIf="cargando" class="loading loading-spinner"></span>
            Registrar Cliente
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
